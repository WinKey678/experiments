<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
</head>
<body>
  <style>
  .logo {
    font-family: Arial, sans-serif;
    letter-spacing: 2px;
    text-align: center;
  }
    .form-input {
        width: 200px;
        padding: 10px;
        margin: 5px;
        border: 1px solid #ccc;
        border-radius: 4px;
        text-align: center;
        align-items: center;
    }
    .login-button {
        padding: 10px 20px;
        background-color: #4CAF50;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        transition: 0.5s;
        text-align: center;
        align-items: center;
    }
    <!-- the button will get big when you hover on it -->
    .login-button:hover {
        background-color: #45a049;
        transform: scale(1.1);
        box-shadow: #00ff00;
        text-align: center;
        align-items: center;
    }
  </style>
  
  <div class="container">
  <img src="logo.png" class="logo">
   <form class="login-card">
      ...
   </form>
  </div>

  <h1 class="logo">Hypothetical</h1>
  <h2>Login Page</h2>
  <form>
    <input class="form-input" type="text" placeholder="Username" />
    <br><br>
    <input class="form-input" type="password" placeholder="Password" />
    <br><br>
    <button class="login-button">Login</button>
  </form>
</body>
</html>
